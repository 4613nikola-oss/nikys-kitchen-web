<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Tečka – talíř</title><defs><pattern id="raster" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.7" fill="#c69a4c" opacity=".65"/></pattern>
<clipPath id="tc"><circle cx="100" cy="112" r="64"/></clipPath></defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.hop{animation:hop 3.2s ease-in-out infinite;transform-origin:100px 186px}
.lis{animation:lis 2.8s ease-in-out infinite}
.oko{animation:mrk 5s infinite}
.bub{animation:bub 2.6s ease-in-out infinite}
.bub2{animation-delay:.7s}
.kon{animation:kon 1.6s ease-in-out infinite}
.kon2{animation-delay:.8s}
.lzice{animation:lzice 1.8s ease-in-out infinite;transform-origin:170px 168px}
}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-5px) scale(.99,1.01)}55%{transform:translateY(-5px)}}
@keyframes lis{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes mrk{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}96%{transform:scaleY(1)}}
@keyframes bub{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-7px);opacity:.55}}
@keyframes kon{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.3;transform:translateY(3px)}}
@keyframes lzice{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
</style><ellipse cx="100" cy="190" rx="70" ry="6" fill="#1f1d1a" opacity=".15"/><g class="hop">
<ellipse cx="100" cy="124" rx="86" ry="44" fill="#fff" stroke="#1f1d1a" stroke-width="5.1"/>
<ellipse cx="100" cy="122" rx="56" ry="26" fill="#f4e2b6" stroke="#1f1d1a" stroke-width="2.5"/>
<g class="lis" style="transform-origin:100px 104px"><path d="M100 104c-1-8 1-15 4-21" fill="none" stroke="#1f1d1a" stroke-width="5.1" stroke-linecap="round"/>
<path d="M104 86c10-14 26-15 34-10-7 14-24 16-34 10z" fill="#5e7769" stroke="#1f1d1a" stroke-width="3.4" stroke-linejoin="round"/>
<path d="M102 90c-9-10-21-10-28-5 6 11 19 12 28 5z" fill="#e0b04a" stroke="#1f1d1a" stroke-width="3.4" stroke-linejoin="round"/></g>
<g class="oko" style="transform-origin:100px 120px"><ellipse cx="82" cy="120" rx="6.75" ry="8.25" fill="#fff" stroke="#1f1d1a" stroke-width="3.1"/><circle cx="83.5" cy="121.5" r="3.75" fill="#1f1d1a"/><circle cx="85" cy="119.25" r="1.35" fill="#fff"/><ellipse cx="118" cy="120" rx="6.75" ry="8.25" fill="#fff" stroke="#1f1d1a" stroke-width="3.1"/><circle cx="119.5" cy="121.5" r="3.75" fill="#1f1d1a"/><circle cx="121" cy="119.25" r="1.35" fill="#fff"/></g><path d="M92 138c6 7 10 7 16 0" fill="none" stroke="#1f1d1a" stroke-width="4.4" stroke-linecap="round"/><circle cx="68" cy="134" r="7" fill="#e9a6a0" opacity=".8"/><circle cx="132" cy="134" r="7" fill="#e9a6a0" opacity=".8"/></g></svg>
