<g class="oko" style="transform-origin:100px 116px"><ellipse cx="82" cy="116" rx="6.3" ry="7.699999999999999" fill="#fff" stroke="#1f1d1a" stroke-width="3.1"/><circle cx="83.4" cy="117.4" r="3.5" fill="#1f1d1a"/><circle cx="84.8" cy="115.3" r="1.26" fill="#fff"/><ellipse cx="118" cy="116" rx="6.3" ry="7.699999999999999" fill="#fff" stroke="#1f1d1a" stroke-width="3.1"/><circle cx="119.4" cy="117.4" r="3.5" fill="#1f1d1a"/><circle cx="120.8" cy="115.3" r="1.26" fill="#fff"/></g><path d="M92 134c6 7 10 7 16 0" fill="none" stroke="#1f1d1a" stroke-width="4.4" stroke-linecap="round"/><circle cx="68" cy="130" r="7" fill="#e9a6a0" opacity=".8"/><circle cx="132" cy="130" r="7" fill="#e9a6a0" opacity=".8"/></g></svg>
