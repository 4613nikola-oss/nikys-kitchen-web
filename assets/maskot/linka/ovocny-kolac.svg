<circle cx="52" cy="118" r="6" fill="#a24e33"/><circle cx="148" cy="118" r="6" fill="#5a6fb0"/><circle cx="70" cy="128" r="5" fill="#5a6fb0"/><circle cx="130" cy="128" r="5" fill="#a24e33"/>
<g class="lis" style="transform-origin:100px 104px"><path d="M100 104c-1-8 1-15 4-21" fill="none" stroke="#3d5233" stroke-width="3" stroke-linecap="round"/>
<path d="M104 86c10-14 26-15 34-10-7 14-24 16-34 10z" fill="#5e7769" stroke="#3d5233" stroke-width="2" stroke-linejoin="round"/>
