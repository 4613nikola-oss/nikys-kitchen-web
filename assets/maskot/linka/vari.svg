<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Tečka – vaří</title><style>
@media (prefers-reduced-motion: no-preference) {
.hop{animation:hop 3.2s ease-in-out infinite;transform-origin:100px 186px}
.lis{animation:lis 2.8s ease-in-out infinite}
.oko{animation:mrk 5s infinite}
.bub{animation:bub 2.6s ease-in-out infinite}
.bub2{animation-delay:.7s}
.kon{animation:kon 1.6s ease-in-out infinite}
.kon2{animation-delay:.8s}
.lzice{animation:lzice 1.8s ease-in-out infinite;transform-origin:170px 168px}
}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-5px) scale(.99,1.01)}55%{transform:translateY(-5px)}}
@keyframes lis{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes mrk{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}96%{transform:scaleY(1)}}
@keyframes bub{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-7px);opacity:.55}}
@keyframes kon{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.3;transform:translateY(3px)}}
@keyframes lzice{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
</style><ellipse cx="100" cy="188" rx="44" ry="6" fill="#3d5233" opacity=".08"/><g class="hop"><circle cx="100" cy="112" r="64" fill="#f1e8d3" stroke="#3d5233" stroke-width="3"/>
<path d="M66 64c-14-4-14-26 4-26 2-14 22-18 30-6 8-12 28-8 30 6 18 0 18 22 4 26z" fill="#fff" stroke="#3d5233" stroke-width="3" stroke-linejoin="round"/>
<path d="M68 64h64v10H68z" fill="#fff" stroke="#3d5233" stroke-width="3" stroke-linejoin="round"/>
<path d="M118 34c8-10 20-10 26-6-5 10-18 11-26 6z" fill="#5e7769" stroke="#3d5233" stroke-width="2" stroke-linejoin="round"/>
<g class="oko" style="transform-origin:100px 110px"><circle cx="80" cy="110" r="4.5" fill="#2c2c2c"/><circle cx="120" cy="110" r="4.5" fill="#2c2c2c"/></g><path d="M90 128c6 6 14 6 20 0" fill="none" stroke="#2c2c2c" stroke-width="3" stroke-linecap="round"/><circle cx="70" cy="124" r="6" fill="#e8a487" opacity=".35"/><circle cx="130" cy="124" r="6" fill="#e8a487" opacity=".35"/>
<g class="lzice"><path d="M160 168l22-62" stroke="#bfa97f" stroke-width="6" stroke-linecap="round"/><ellipse cx="183" cy="100" rx="7" ry="11" fill="#bfa97f" stroke="#3d5233" stroke-width="2" transform="rotate(20 183 100)"/></g></g></svg>
