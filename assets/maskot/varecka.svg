<path d="M110 132c18 2 27 11 31 24" fill="none" stroke="#1f1d1a" stroke-width="6.0" stroke-linecap="round"/>
<ellipse cx="100" cy="68" rx="47" ry="56" fill="#e6b97c" stroke="#1f1d1a" stroke-width="5.1"/>
