<path d="M60 24c-6-20 20-27 27-16 7-15 33-11 31 5 16-4 24 16 9 24H65c-9-2-11-9-5-13z" fill="#fff" stroke="#1f1d1a" stroke-width="5.1" stroke-linejoin="round"/>
<path d="M70 50l15 5M130 50l-15 5" stroke="#1f1d1a" stroke-width="5.1" stroke-linecap="round"/>
