<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Tečka – nákupní košík</title><style>
@media (prefers-reduced-motion: no-preference) {
.hop{animation:hop 3.2s ease-in-out infinite;transform-origin:100px 186px}
.lis{animation:lis 2.8s ease-in-out infinite}
.oko{animation:mrk 5s infinite}
.bub{animation:bub 2.6s ease-in-out infinite}
.bub2{animation-delay:.7s}
.kon{animation:kon 1.6s ease-in-out infinite}
.kon2{animation-delay:.8s}
.lzice{animation:lzice 1.8s ease-in-out infinite;transform-origin:170px 168px}
}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-5px) scale(.99,1.01)}55%{transform:translateY(-5px)}}
@keyframes lis{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes mrk{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}96%{transform:scaleY(1)}}
@keyframes bub{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-7px);opacity:.55}}
@keyframes kon{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.3;transform:translateY(3px)}}
@keyframes lzice{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
