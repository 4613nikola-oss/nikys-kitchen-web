<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Tečka – sklenice</title><defs><pattern id="raster" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.7" fill="#c69a4c" opacity=".65"/></pattern>
<clipPath id="tc"><circle cx="100" cy="112" r="64"/></clipPath></defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.hop{animation:hop 3.2s ease-in-out infinite;transform-origin:100px 186px}
.lis{animation:lis 2.8s ease-in-out infinite}
.oko{animation:mrk 5s infinite}
.bub{animation:bub 2.6s ease-in-out infinite}
.bub2{animation-delay:.7s}
.kon{animation:kon 1.6s ease-in-out infinite}
.kon2{animation-delay:.8s}
.lzice{animation:lzice 1.8s ease-in-out infinite;transform-origin:170px 168px}
}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-5px) scale(.99,1.01)}55%{transform:translateY(-5px)}}
@keyframes lis{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes mrk{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}96%{transform:scaleY(1)}}
@keyframes bub{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-7px);opacity:.55}}
@keyframes kon{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.3;transform:translateY(3px)}}
@keyframes lzice{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
</style><ellipse cx="100" cy="190" rx="36" ry="6" fill="#1f1d1a" opacity=".15"/><g class="hop">
<path d="M120 40l18-30" stroke="#a24e33" stroke-width="6.8" stroke-linecap="round"/>
<path d="M60 44h80l-8 136H68z" fill="#d7e8cf" stroke="#1f1d1a" stroke-width="5.1" stroke-linejoin="round"/>
<path d="M62 70h76" stroke="#1f1d1a" stroke-width="2.5" opacity=".4"/>
<circle cx="80" cy="56" r="7" fill="#fff" stroke="#1f1d1a" stroke-width="2.5"/><path d="M116 50c8-10 20-10 26-6-5 10-18 11-26 6z" fill="#5e7769" stroke="#1f1d1a" stroke-width="3.4"/>
<g class="oko" style="transform-origin:100px 112px"><ellipse cx="82" cy="112" rx="7.2" ry="8.8" fill="#fff" stroke="#1f1d1a" stroke-width="3.1"/><circle cx="83.6" cy="113.6" r="4" fill="#1f1d1a"/><circle cx="85.2" cy="111.2" r="1.4400000000000002" fill="#fff"/><ellipse cx="118" cy="112" rx="7.2" ry="8.8" fill="#fff" stroke="#1f1d1a" stroke-width="3.1"/><circle cx="119.6" cy="113.6" r="4" fill="#1f1d1a"/><circle cx="121.2" cy="111.2" r="1.4400000000000002" fill="#fff"/></g><path d="M91 130c6 7 12 7 18 0" fill="none" stroke="#1f1d1a" stroke-width="4.4" stroke-linecap="round"/><circle cx="70" cy="126" r="7" fill="#e9a6a0" opacity=".8"/><circle cx="130" cy="126" r="7" fill="#e9a6a0" opacity=".8"/></g></svg>
